[project]
name = "netscope"
description = "NetScope X1 diagnostic engine, API and simulator"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dynamic = ["version"]
dependencies = ["aiohttp>=3.9", "fpdf2>=2.7"]

[project.optional-dependencies]
device = ["pyserial>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
netscope = "netscope.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netscope", "netscope.api", "netscope.cable", "netscope.engine", "netscope.hal",
            "netscope.net", "netscope.reports"]

[tool.setuptools.dynamic]
version = { attr = "netscope.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
