<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetScope X1</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<!-- The device panel is 720 x 1280 portrait. On a desktop the frame is scaled to fit. -->
<div id="frame">
  <header id="bar">
    <span id="clock"></span>
    <span id="sim" hidden>Simulated data</span>
    <span id="batt"></span>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="keys" aria-label="Soft keys">
    <button id="k-back" data-nofocus>Back</button>
    <button id="k-home" data-nofocus>Home</button>
    <button id="k-ctx" data-nofocus hidden></button>
  </nav>
  <div id="modal" hidden></div>
  <div id="osk" hidden></div>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
