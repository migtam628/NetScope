      - [D10,  F,   0.0, 26.5,   4.0,  2.0,  0.6]
      - [Y1,   F, -13.0, -9.0,   3.2,  2.5,  0.8, extra]
      - [Y2,   F,   0.0, 12.5,   3.2,  2.5,  0.8, extra]
      - [U11,  F, -22.0, -4.0,   9.0,  9.0,  0.9]
      - [U40,  F, -22.0, -24.0,  7.0,  7.0,  0.6]
      - [J40,  F, -38.0, -30.0,  8.0,  5.0,  0.0]
      - [U60,  F,  30.0, -30.0,  5.0,  5.0,  0.9]
