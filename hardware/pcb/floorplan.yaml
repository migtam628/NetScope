# NetScope X1 board floorplan, rev A draft.
#
# Placement of every part in hardware/netlist/netscope-x1.yaml on two boards.
# Checked by tools/render_floorplan.py (outline, overlaps, height limits,
# isolation spacing, every netlist part placed) and turned into 3D by
# mechanical/enclosure.py.
#
# STATUS: a floorplan, not a layout.  Nothing is routed.  Part envelopes are
# approximate (package class, not the selected part's land pattern) and 14
# parts have no part number yet.  Decoupling and other small passives are not
# placed; the free area has to absorb them.
#
# Coordinates: mm, origin at the board centre, X right and Y up when looking
# at the FRONT of the device, for both sides (the back is seen through the
# board).  place: [ref, side F|B, x, y, w, h, height, flags...]
#   tht   = through-hole, occupies both sides
#   over  = may overhang the board edge (connectors)
#   tabs  = extra outline rectangles [x0, y0, x1, y1] added to the board
#   extra = not a netlist part (mounting hole, inductor from the BOM, pin field)

rules:
  edge_margin: 0.5        # part edge to board edge
  clearance: 0.3          # between parts on one side
  isolation: 2.5          # between parts of different domains (barrier parts exempt)
  hole_keepout: 2.9       # radius kept clear around an M2.5 mounting hole

boards:
  main:
    title: "Main board: 88 x 88 mm + card tab, 6 layers"
    size: [88, 88]
    tabs: [[-16, 44, -1, 50]]    # 15 x 6 mm tab carrying the microSD socket to the top end wall
    centre_in_enclosure: [0, 53]
    limits:               # max part height by side and Y band (board coordinates)
      F: [[-44, 44, 1.5]]                       # 2.0 mm gap to the display module
      B: [[-44, 44, 23.0]]                      # open down to the rear wall
    # Zones, looking at the front: cable-side and PoE parts on the left (x < -16),
    # system parts in the middle and right, the three ports along the top edge.
    place:
      # ---- top edge: ports -----------------------------------------------------
      - [J10,  B, -27.0, 39.75, 16.4, 21.5, 13.5, tht, over]   # Port A, test port
      - [J11,  B,  10.0, 39.75, 16.4, 21.5, 13.5, tht, over]   # Port B, uplink (integrated magnetics)
      - [J32,  B,  33.25, 28.65, 14.5, 48.7, 9.8, tht, over]   # Port C, SFP+ cage, mouth through the wall
      - [J30,  B,  -8.5, 41.5,  12.0, 15.0,  1.9]              # microSD, card slot faces the top wall
      # ---- left column, back: cable side then PoE island ------------------------
      - [K1,   B, -36.3, 22.9,  10.6,  7.4,  5.4]
      - [K2,   B, -24.7, 22.9,  10.6,  7.4,  5.4]
      - [K3,   B, -36.3, 14.5,  10.6,  7.4,  5.4]
      - [K4,   B, -24.7, 14.5,  10.6,  7.4,  5.4]
      - [T1,   B, -30.5,  2.5,  18.3, 12.2,  6.4]
      - [U20,  B, -17.7, -4.5,   6.2,  5.0,  1.75]
      - [R20,  B, -31.0, -17.0, 21.0, 19.0, 19.0, tht]         # 6 upright resistors, 2 x 3, on a fin
      - [Q20,  B, -36.5, -31.5, 10.2,  5.6,  1.1]
      - [PS1,  B, -22.0, -35.5, 10.5, 13.7,  3.2]
      # ---- middle and right, back: processor and power ---------------------------
      - [M1,   B,  16.0, -16.5, 55.0, 40.0,  6.0]
      - [BT1,  B,  -7.5,  8.0,  10.0,  7.0,  6.0]              # battery connector (pack is off-board)
      - [U50,  B,   4.5,  8.5,  10.0,  8.0,  2.0]              # charger + its inductor
      - [L1,   B,  15.0,  9.0,   8.0,  8.0,  4.0, extra]       # boost inductor (BOM line boost_l)
      - [U52,  B,  15.0, 17.0,   4.5,  3.5,  0.9]
      - [U53,  B,   5.0, 17.0,   5.0,  4.0,  1.2]
      - [U51,  B,  -3.0, 16.5,   3.0,  3.0,  0.8]
      - [U55,  B,  -6.0, 23.5,  12.0, 10.0,  3.0]
      - [U54,  B,   7.0, 24.5,   6.0,  6.0,  2.0]
      # ---- front: low-profile parts under the display ----------------------------
      - [PROT1, F, -30.5, 18.7, 22.0,  9.0,  1.2]
      - [U30,  F, -11.5, 22.0,   5.0,  6.4,  1.2]
      - [U31,  F,  -5.0, 22.0,   5.0,  6.4,  1.2]
      - [U32,  F, -11.5, 13.0,   3.0,  3.0,  1.1]
      - [U33,  F,  -5.0, 13.0,   4.0,  4.0,  0.9]
      - [U10,  F,  -8.0,  2.0,   7.0,  7.0,  0.9]
      - [D10,  F, -14.0,  2.0,   2.0,  4.0,  0.6]
      - [Y2,   F,  -2.0,  4.0,   3.2,  2.5,  0.8, extra]
      - [U11,  F,  10.0, -15.0,  9.0,  9.0,  0.9]
      - [Y1,   F,   2.0, -22.0,  3.2,  2.5,  0.8, extra]
      - [U70,  F,  18.0, 14.0,   7.0, 11.0,  1.2]
      - [U40,  F,  26.0, -28.0,  7.0,  7.0,  0.6]
      - [J40,  F,  38.0, -20.0,  8.0,  5.0,  0.0]
      - [U60,  F,  -8.0, 33.0,   5.0,  5.0,  0.9]
      - [U21,  F, -40.0, -31.5,  5.0,  5.0,  0.9]
      - [U22,  F, -33.5, -30.5,  4.9,  3.0,  1.1]
      - [U23,  F, -27.5, -30.5,  4.9,  3.0,  1.1]
      - [U24,  F, -20.3, -31.5,  6.4,  5.0,  1.2]
      - [U25,  F, -40.0, -36.0,  3.0,  3.0,  1.2]
      - [D21,  F, -30.5, -36.2, 11.0,  4.6,  1.1]
      - [D20,  F, -30.5, -41.2, 11.0,  4.6,  1.1]
      - [D22,  F, -21.0, -36.5,  4.5,  2.7,  1.1]
      - [J50,  F,  -3.0, -41.0, 18.0,  4.0,  1.0, extra]       # 30-way FFC to the lower board
      - [J1,   F,  15.0, -41.0, 15.0,  4.0,  1.0]              # display FFC
      - [J51,  F,  30.5, -41.0, 13.0,  4.0,  1.0, extra]       # 20-way power FFC to the lower board
      - [H1,   F, -40.5, 34.0, 0, 0, 0, hole]
      - [H2,   F,  22.0, 26.0, 0, 0, 0, hole]
      - [H3,   F, -40.0, -40.5, 0, 0, 0, hole]
      - [H4,   F,  40.5, -40.6, 0, 0, 0, hole]

  lower:
    title: "Keypad and USB-C board: 88 x 56 mm, 2 layers"
    size: [88, 56]
    centre_in_enclosure: [0, -73]
    limits:
      F: [[-28, 28, 9.8]]                       # keypad cavity
      B: [[-28, -19.5, 23.0], [-19.5, 28, 1.0]] # battery cells are 1.2 mm behind most of this board
    place:
      # ---- front: keys, indicators, links -------------------------------------
      - [SW1,  F, -22.0,  -3.0,  6.2, 6.2, 9.5]
      - [SW1,  F,  -8.5,  -3.0,  6.2, 6.2, 9.5]
      - [SW1,  F, -35.5,  -3.0,  6.2, 6.2, 9.5]
      - [SW1,  F, -22.0,  10.5,  6.2, 6.2, 9.5]
      - [SW1,  F, -22.0, -16.5,  6.2, 6.2, 9.5]
      - [SW1,  F,  24.0,  11.0,  6.2, 6.2, 9.5]
      - [SW1,  F,  24.0,  -4.0,  6.2, 6.2, 9.5]
      - [SW1,  F,  24.0, -19.0,  6.2, 6.2, 9.5]
      - [SW1,  F,  38.0,  18.0,  6.2, 6.2, 9.5]             # power key (recessed opening)
      - [LED1, F, -12.0,  25.0,  1.6, 0.8, 0.6]
      - [LED1, F,  -4.0,  25.0,  1.6, 0.8, 0.6]
      - [LED1, F,   4.0,  25.0,  1.6, 0.8, 0.6]
      - [LED1, F,  12.0,  25.0,  1.6, 0.8, 0.6]
      - [BZ1,  F,  37.5,  -4.0,  9.0, 9.0, 3.0]
      - [J50,  F, -28.0,  24.5, 18.0, 4.0, 1.0, extra]
      - [J51,  F,  28.0,  24.5, 13.0, 4.0, 1.0, extra]
      # ---- back: USB-C only (the cells sit behind the rest) ---------------------
      - [J20,  B,   0.0, -24.3,  9.0, 7.4, 3.3, over]
      - [D30,  B,   0.0, -17.5,  3.0, 2.0, 0.6]
      - [H5,   F, -41.0,  15.0, 0, 0, 0, hole]
      - [H6,   F, -41.0, -24.0, 0, 0, 0, hole]
      - [H7,   F,  41.0,   8.0, 0, 0, 0, hole]
      - [H8,   F,  41.0, -24.0, 0, 0, 0, hole]
