      - [U25,  F,  40.0, 15.5,   3.0,  3.0,  1.2]
      - [D20,  F,  15.5, 25.0,  11.0,  4.6,  1.1]
      - [D21,  F,  27.5, 25.0,  11.0,  4.6,  1.1]
      - [D22,  F,  37.5, 25.0,   4.5,  2.7,  1.1]
      - [J50,  F, -28.0, -41.0, 18.0,  4.0,  1.0, extra]   # 30-way FFC to the lower board
      - [J1,   F,   0.0, -41.0, 15.0,  4.0,  1.0]          # display FFC
      - [J51,  F,  26.0, -41.0, 13.0,  4.0,  1.0, extra]   # 20-way power FFC to the lower board
      - [H1,   F, -39.5, 34.0, 0, 0, 0, hole]
      - [H2,   F,  39.5, 34.0, 0, 0, 0, hole]
      - [H3,   F, -40.0, -40.5, 0, 0, 0, hole]
      - [H4,   F,  16.0, -40.0, 0, 0, 0, hole]

  lower:
    title: "Keypad and USB-C board: 88 x 56 mm, 2 layers"
    size: [88, 56]
    centre_in_enclosure: [0, -73]
    limits:
      F: [[-28, 28, 9.8]]                       # keypad cavity
