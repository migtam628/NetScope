# NetScope X1 bench kit (dev-kit spike, docs/15) - how the bought boards and the
# breadboard front end connect.  Same format as hardware/netlist/netscope-x1.yaml
# and checked by the same tool.  Pins are named by function; take header pin
# numbers from each board's user guide when wiring.
#
# STATUS: drawn from the design intent in docs/02 and docs/03.  It has not been
# built.  Resistor values in the wiremap front end are a starting point to be
# tuned on the bench.  Confirm every evaluation-board connector against its
# user guide before applying power.
#
# Domains: SYS = bench electronics sharing the Pi's ground; LINE = cable
# conductors; POE = everything powered from the PoE source.  The PoE module
# (A5) shares NO connection with SYS: read it with a battery multimeter.

title: "NetScope X1 bench kit - wiring schematic"
status: "Not built. Confirm every eval-board connector against its user guide before power."

barriers:
  A4:  {type: integrated magnetics, rating: "KSZ9131 card's on-board magnetics"}
  K1:  {type: relay, rating: "contacts LINE<->LINE only; coil in SYS"}
  K2:  {type: relay, rating: "contacts LINE<->LINE only; coil in SYS"}
  K3:  {type: relay, rating: "contacts LINE<->LINE only; coil in SYS"}
  K4:  {type: relay, rating: "contacts LINE<->LINE only; coil in SYS"}
  RN1: {type: protection network, rating: "8x 2k2 series + D1 clamps; limits fault current to under 12 mA at 24 V"}
  RN2: {type: protection network, rating: "8x 1M series; pin-voltage sense only"}

components:
  # --- processor side ---------------------------------------------------------
  PSU1: {part: "27 W USB-C supply",                         domain: SYS}
  A1:   {part: "CM5 on CM5 IO board",                       domain: SYS}
  A2:   {part: "Touch Display 2, 5 inch",                   domain: SYS}
  A3:   {part: "EVB-LAN7801-EDS host (USB3 to RGMII)",      domain: SYS}
  A4:   {part: "KSZ9131 PHY daughter card + RJ45",          domain: [SYS, LINE]}
  # --- relay adapter: mirrors Port A of the product ---------------------------
  J1:   {part: "RJ45 breakout: patch lead to A4",           domain: LINE}
  J2:   {part: "RJ45 breakout: cable under test",           domain: LINE}
  K1:   {part: "DPDT signal relay 5 V coil, pair 1-2",      domain: [LINE, SYS]}
  K2:   {part: "DPDT signal relay 5 V coil, pair 3-6",      domain: [LINE, SYS]}
  K3:   {part: "DPDT signal relay 5 V coil, pair 4-5",      domain: [LINE, SYS]}
  K4:   {part: "DPDT signal relay 5 V coil, pair 7-8",      domain: [LINE, SYS]}
  Q1:   {part: "NPN + 1k base R + flyback diode (coil driver)", domain: SYS}
  # --- wiremap front end on breadboard ----------------------------------------
  RN1:  {part: "8x 2k2 1% series resistors",                domain: [LINE, SYS]}
  D1:   {part: "8x BAT54S clamp pairs to +3V3 / GND",       domain: SYS}
  RN2:  {part: "8x 1M sense resistors",                     domain: [LINE, SYS]}
  RN3:  {part: "8x 47k to VMID (completes 1M:47k dividers)", domain: SYS}
  U1:   {part: "74HC4051 breakout: DRIVE mux",              domain: SYS}
  U2:   {part: "74HC4051 breakout: RETURN mux",             domain: SYS}
  U3:   {part: "74HC4051 breakout: PIN-VOLTAGE mux",        domain: SYS}
  R1:   {part: "1k0 1% source resistor (high range)",       domain: SYS}
  R2:   {part: "47k 1% source resistor (low range)",        domain: SYS}
  R3:   {part: "1k0 1% sense resistor (high range)",        domain: SYS}
  R4:   {part: "47k 1% sense resistor (low range)",         domain: SYS}
  U4:   {part: "MCP6002 dual op-amp: two unity buffers",    domain: SYS}
  R5:   {part: "2x 10k divider making VMID = 1.65 V + 100n", domain: SYS}
  A6:   {part: "NUCLEO-G0B1RE (runs coproc/dispatch.c)",    domain: SYS}
  # --- far end of the cable under test -----------------------------------------
  RT1:  {part: "RT-1 terminator: 4x (1N4148 + R) on an RJ45 plug", domain: LINE}
  # --- PoE identification (stand-alone, step 3) ----------------------------------
  PSE1: {part: "PoE switch or injector under test",         domain: POE}
  A5:   {part: "TPS2372-4EVM-006 PD module",                domain: POE}
  RL1:  {part: "Load resistors: 470R 10 W, 180R 25 W, 100R 50 W (switched in by hand)", domain: POE}
  DMM1: {part: "Battery multimeter (floating)",             domain: POE}

sheets:
  "Processor, display, test-port MAC and PHY": [PSU1, A1, A2, A3, A4, A6]
  "Relay adapter and cable": [J1, K1, K2, K3, K4, Q1, J2, RT1]
  "Wiremap front end (breadboard)": [RN1, D1, U1, U2, R1, R2, R3, R4, U4, RN2, RN3, U3, R5]
  "PoE identification (isolated from everything else)": [PSE1, A5, RL1, DMM1]

nets:
  # --- power and processor ------------------------------------------------------
  - {name: USBC_5V1, domain: SYS, nodes: [PSU1.USB_C, A1.USB_C_POWER]}
  - {name: DSI, domain: SYS, nodes: [A1.DSI1_FFC, A2.DSI_FFC]}
  - {name: DISP_5V, domain: SYS, nodes: [A1.HDR_5V, A2.5V]}
  - {name: USB3, domain: SYS, nodes: [A1.USB3_TYPE_A, A3.USB3_UPSTREAM]}
  - {name: EDS_RGMII_MDIO, domain: SYS, nodes: [A3.EDS_CONNECTOR, A4.EDS_CONNECTOR]}
  - {name: COPROC_TX, domain: SYS, nodes: [A1.GPIO14_TXD, A6.USART_RX]}
  - {name: COPROC_RX, domain: SYS, nodes: [A1.GPIO15_RXD, A6.USART_TX]}
  - {name: +5V, domain: SYS, source: A6.5V, nodes: [A6.5V, K1.COIL_PLUS, K2.COIL_PLUS, K3.COIL_PLUS, K4.COIL_PLUS, Q1.FLYBACK_K]}
  - {name: +3V3, domain: SYS, source: A6.3V3, nodes: [A6.3V3, U1.VCC, U2.VCC, U3.VCC, U4.VDD, D1.CLAMP_POS, R5.TOP]}
  - {name: GND, domain: SYS, nodes: [A1.HDR_GND, A2.GND, A6.GND, Q1.EMITTER, U1.GND_VEE_EN, U2.GND_VEE_EN, U3.GND_VEE_EN, U4.VSS, D1.CLAMP_NEG, R5.BOTTOM]}
  # --- PHY to relay adapter (a normal patch lead) -----------------------------------
  - {name: PHY_L1, domain: LINE, nodes: [A4.RJ45_P1, J1.P1, K1.NC_A]}
  - {name: PHY_L2, domain: LINE, nodes: [A4.RJ45_P2, J1.P2, K1.NC_B]}
  - {name: PHY_L3, domain: LINE, nodes: [A4.RJ45_P3, J1.P3, K2.NC_A]}
  - {name: PHY_L6, domain: LINE, nodes: [A4.RJ45_P6, J1.P6, K2.NC_B]}
  - {name: PHY_L4, domain: LINE, nodes: [A4.RJ45_P4, J1.P4, K3.NC_A]}
  - {name: PHY_L5, domain: LINE, nodes: [A4.RJ45_P5, J1.P5, K3.NC_B]}
  - {name: PHY_L7, domain: LINE, nodes: [A4.RJ45_P7, J1.P7, K4.NC_A]}
  - {name: PHY_L8, domain: LINE, nodes: [A4.RJ45_P8, J1.P8, K4.NC_B]}
  # --- relay commons to the cable under test, RT-1 at the far end ----------------------
  - {name: CUT_1, domain: LINE, nodes: [K1.COM_A, J2.P1, RT1.P1_D1_ANODE]}
  - {name: CUT_2, domain: LINE, nodes: [K1.COM_B, J2.P2, RT1.P2_R_1k0]}
  - {name: CUT_3, domain: LINE, nodes: [K2.COM_A, J2.P3, RT1.P3_D2_ANODE]}
  - {name: CUT_6, domain: LINE, nodes: [K2.COM_B, J2.P6, RT1.P6_R_2k2]}
  - {name: CUT_4, domain: LINE, nodes: [K3.COM_A, J2.P4, RT1.P4_D3_ANODE]}
  - {name: CUT_5, domain: LINE, nodes: [K3.COM_B, J2.P5, RT1.P5_R_4k7]}
  - {name: CUT_7, domain: LINE, nodes: [K4.COM_A, J2.P7, RT1.P7_D4_ANODE]}
  - {name: CUT_8, domain: LINE, nodes: [K4.COM_B, J2.P8, RT1.P8_R_ID]}
  # --- relay energised = TEST: line to the protected front end -------------------------
  - {name: T1, domain: LINE, nodes: [K1.NO_A, RN1.IN1, RN2.IN1]}
  - {name: T2, domain: LINE, nodes: [K1.NO_B, RN1.IN2, RN2.IN2]}
  - {name: T3, domain: LINE, nodes: [K2.NO_A, RN1.IN3, RN2.IN3]}
  - {name: T6, domain: LINE, nodes: [K2.NO_B, RN1.IN6, RN2.IN6]}
  - {name: T4, domain: LINE, nodes: [K3.NO_A, RN1.IN4, RN2.IN4]}
  - {name: T5, domain: LINE, nodes: [K3.NO_B, RN1.IN5, RN2.IN5]}
  - {name: T7, domain: LINE, nodes: [K4.NO_A, RN1.IN7, RN2.IN7]}
  - {name: T8, domain: LINE, nodes: [K4.NO_B, RN1.IN8, RN2.IN8]}
  - {name: RELAY_COIL_LOW, domain: SYS, nodes: [Q1.COLLECTOR, K1.COIL_MINUS, K2.COIL_MINUS, K3.COIL_MINUS, K4.COIL_MINUS]}
  - {name: RELAY_DRV, domain: SYS, nodes: [A6.GPIO_RELAY, Q1.BASE_VIA_1k]}
  # --- protected lines into the drive and return muxes ---------------------------------
  - {name: WM1, domain: SYS, nodes: [RN1.OUT1, D1.MID1, U1.Y0, U2.Y0]}
  - {name: WM2, domain: SYS, nodes: [RN1.OUT2, D1.MID2, U1.Y1, U2.Y1]}
  - {name: WM3, domain: SYS, nodes: [RN1.OUT3, D1.MID3, U1.Y2, U2.Y2]}
  - {name: WM4, domain: SYS, nodes: [RN1.OUT4, D1.MID4, U1.Y3, U2.Y3]}
  - {name: WM5, domain: SYS, nodes: [RN1.OUT5, D1.MID5, U1.Y4, U2.Y4]}
  - {name: WM6, domain: SYS, nodes: [RN1.OUT6, D1.MID6, U1.Y5, U2.Y5]}
  - {name: WM7, domain: SYS, nodes: [RN1.OUT7, D1.MID7, U1.Y6, U2.Y6]}
  - {name: WM8, domain: SYS, nodes: [RN1.OUT8, D1.MID8, U1.Y7, U2.Y7]}
  # source: one of two GPIOs driven high through its resistor, the other left floating
  - {name: SRC_HI, domain: SYS, nodes: [A6.GPIO_SRC_HI, R1.A]}
  - {name: SRC_LO, domain: SYS, nodes: [A6.GPIO_SRC_LO, R2.A]}
  - {name: WM_DRIVE, domain: SYS, nodes: [R1.B, R2.B, U1.Z_COMMON, U4.IN_A_PLUS]}
  # sense: one of two GPIOs driven low through its resistor, the other left floating
  - {name: SNS_HI, domain: SYS, nodes: [A6.GPIO_SNS_HI, R3.A]}
  - {name: SNS_LO, domain: SYS, nodes: [A6.GPIO_SNS_LO, R4.A]}
  - {name: WM_RETURN, domain: SYS, nodes: [R3.B, R4.B, U2.Z_COMMON, U4.IN_B_PLUS]}
  - {name: ADC_DRIVE_V, domain: SYS, nodes: [U4.OUT_A_FB_TO_IN_A_NEG, A6.ADC_IN0]}
  - {name: ADC_RETURN_V, domain: SYS, nodes: [U4.OUT_B_FB_TO_IN_B_NEG, A6.ADC_IN1]}
  - {name: DRV_SEL, domain: SYS, nodes: [A6.GPIO_DRV_S0_S1_S2, U1.S0_S1_S2]}
  - {name: RET_SEL, domain: SYS, nodes: [A6.GPIO_RET_S0_S1_S2, U2.S0_S1_S2]}
  # --- pin-voltage sense: 1M from each line, 47k to VMID, reads about +/-36 V ------------
  - {name: PV1, domain: SYS, nodes: [RN2.OUT1, RN3.A1, U3.Y0]}
  - {name: PV2, domain: SYS, nodes: [RN2.OUT2, RN3.A2, U3.Y1]}
  - {name: PV3, domain: SYS, nodes: [RN2.OUT3, RN3.A3, U3.Y2]}
  - {name: PV4, domain: SYS, nodes: [RN2.OUT4, RN3.A4, U3.Y3]}
  - {name: PV5, domain: SYS, nodes: [RN2.OUT5, RN3.A5, U3.Y4]}
  - {name: PV6, domain: SYS, nodes: [RN2.OUT6, RN3.A6, U3.Y5]}
  - {name: PV7, domain: SYS, nodes: [RN2.OUT7, RN3.A7, U3.Y6]}
  - {name: PV8, domain: SYS, nodes: [RN2.OUT8, RN3.A8, U3.Y7]}
  - {name: VMID, domain: SYS, nodes: [R5.MID_1V65, RN3.COMMON, A6.ADC_IN3]}
  - {name: ADC_PIN_V, domain: SYS, nodes: [U3.Z_COMMON, A6.ADC_IN2]}
  - {name: PV_SEL, domain: SYS, nodes: [A6.GPIO_PV_S0_S1_S2, U3.S0_S1_S2]}
  # --- PoE identification: nothing here touches SYS ---------------------------------------
  - {name: POE_CABLE, domain: POE, nodes: [PSE1.POE_PORT_RJ45, A5.POE_INPUT_RJ45]}
  - {name: PD_VOUT_P, domain: POE, nodes: [A5.VOUT_PLUS, RL1.A, DMM1.V_PLUS]}
  - {name: PD_VOUT_N, domain: POE, nodes: [A5.VOUT_RTN, RL1.B, DMM1.COM]}
  - {name: PD_INDICATORS, domain: POE, nodes: [A5.TPH_TPL_BT_PG_TPS, DMM1.PROBE_BY_HAND]}
