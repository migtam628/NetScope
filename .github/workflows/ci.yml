name: CI
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "firmware[dev]"
      - run: pytest
        working-directory: firmware
  coprocessor-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/coproc test
  hardware-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python tools/check_netlist.py
      - run: python tools/cost_rollup.py
      - run: python tools/power_budget.py
      - run: python tools/render_floorplan.py
      - run: python tools/render_schematic.py hardware/netlist/netscope-x1.yaml /tmp/sch/main
      - run: python tools/render_schematic.py hardware/spike/bench-kit.yaml /tmp/sch/bench

  kicad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-symbols kicad-footprints python3-yaml
          mkdir -p ~/.config/kicad/9.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/9.0/
      - run: kicad-cli version
      - name: Generated schematic is in step with the netlist
        run: |
          /usr/bin/python3 tools/gen_kicad.py
          git diff --exit-code -- hardware/kicad
      - run: /usr/bin/python3 tools/check_kicad.py
      - name: RT-1 schematic is in step with the firmware definition
        run: |
          /usr/bin/python3 tools/gen_rt1.py
          git diff --exit-code -- hardware/remote-terminator/kicad
      - run: /usr/bin/python3 tools/check_rt1.py
