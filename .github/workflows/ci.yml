name: CI
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "firmware[dev]"
      - run: pytest
        working-directory: firmware
  coprocessor-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/coproc test
  hardware-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python tools/check_netlist.py
      - run: python tools/cost_rollup.py
      - run: python tools/power_budget.py
      - run: python tools/render_floorplan.py
      - run: python tools/render_schematic.py hardware/netlist/netscope-x1.yaml /tmp/sch/main
      - run: python tools/render_schematic.py hardware/spike/bench-kit.yaml /tmp/sch/bench

  kicad:
    runs-on: ubuntu-24.04
    # KiCad's own image: no dependency on the Launchpad package archive at run time
    container:
      image: kicad/kicad:9.0.9
      options: --user root
    steps:
      - name: Tools the image may lack
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git python3-yaml
      - uses: actions/checkout@v4
      - name: Library tables and repository trust
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$HOME/.config/kicad/9.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/9.0/"
          ls /usr/share/kicad/symbols | head -3
          /usr/bin/python3 -c "import pcbnew, yaml, sys; print(sys.version.split()[0], pcbnew.Version())"
      - run: kicad-cli version
      - name: Generated schematic is in step with the netlist
        run: |
          /usr/bin/python3 tools/gen_kicad.py
          git diff --exit-code -- hardware/kicad
      - run: /usr/bin/python3 tools/check_kicad.py
      - name: RT-1 schematic is in step with the firmware definition
        run: |
          /usr/bin/python3 tools/gen_rt1.py
          git diff --exit-code -- hardware/remote-terminator/kicad
      - run: /usr/bin/python3 tools/check_rt1.py
